name: wallet_client_flutter
description: Benny Wallet Flutter client for Web, iOS and Android.
publish_to: none
version: 0.0.40+40

environment:
  sdk: "^3.8.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  dio: ^5.9.0
  solana: ^0.32.0
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.2.0
  shared_preferences: ^2.5.3
  qr_flutter: ^4.1.0
  cached_network_image: ^3.4.1
  local_auth: ^2.3.0
  flutter_local_notifications: ^19.4.2
  package_info_plus: ^9.0.0
  connectivity_plus: ^7.0.0
  url_launcher: ^6.3.2
  mobile_scanner: ^7.2.0
  bip39: ^1.0.6
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  design_system:
    path: ../../packages/design_system
  shared_types:
    path: ../../packages/shared_types
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.6.0
  freezed: ^3.2.0
  json_serializable: ^6.11.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/benny_logo.png
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope/Manrope-wght.ttf
          weight: 400
        - asset: assets/fonts/Manrope/Manrope-wght.ttf
          weight: 600
        - asset: assets/fonts/Manrope/Manrope-wght.ttf
          weight: 700
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora/Sora-wght.ttf
          weight: 400
        - asset: assets/fonts/Sora/Sora-wght.ttf
          weight: 700
        - asset: assets/fonts/Sora/Sora-wght.ttf
          weight: 800
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-wght.ttf
          weight: 700
