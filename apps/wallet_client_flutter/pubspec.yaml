name: wallet_client_flutter
description: Benny Wallet Flutter client for Web, iOS and Android.
publish_to: none
version: 0.2.1+61

environment:
  sdk: "^3.8.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  dio: ^5.9.0
  intl: ^0.20.2
  solana: ^0.32.0
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.2.0
  shared_preferences: ^2.5.3
  qr_flutter: ^4.1.0
  cached_network_image: ^3.4.1
  local_auth: ^2.3.0
  flutter_local_notifications: ^19.4.2
  package_info_plus: ^9.0.0
  connectivity_plus: ^7.0.0
  url_launcher: ^6.3.2
  mobile_scanner: ^7.2.0
  bip39: ^1.0.6
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  design_system:
    path: ../../packages/design_system
  shared_types:
    path: ../../packages/shared_types
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  meta: ^1.19.0
  reown_walletkit: ^1.3.8
  app_links: ^7.2.2
  flutter_inappwebview: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.6.0
  freezed: ^3.2.0
  json_serializable: ^6.11.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/brand/benny_logo.png
    - assets/brand/benny_wallet_icon_96.png
    - assets/browser/
    - assets/brand/pump_mark.svg
    - assets/market_logos/
    - assets/signer_token_icons/
    - assets/kline/
  # Static weights cut from the variable fonts: Flutter does not move a
  # variable font's weight axis for FontWeight, so one variable file under
  # several weights rendered faux bold over Manrope's ExtraLight default.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope/Manrope-ExtraBold.ttf
          weight: 800
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora/Sora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Sora/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora/Sora-Bold.ttf
          weight: 700
        - asset: assets/fonts/Sora/Sora-ExtraBold.ttf
          weight: 800
