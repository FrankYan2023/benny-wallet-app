<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: transparent;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #chart { position: absolute; inset: 0; }
  #legend {
    position: absolute;
    left: 16px;
    top: 4px;
    right: 16px;
    z-index: 3;
    pointer-events: none;
    font-size: 10.5px;
    line-height: 15px;
    font-variant-numeric: tabular-nums;
  }
  #legend .row { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #legend span { margin-right: 6px; }
</style>
</head>
<body>
<div id="chart"></div>
<div id="legend"></div>
<script>/*LIGHTWEIGHT_CHARTS*/</script>
<script>
(function () {
  'use strict';
  var LWC = window.LightweightCharts;
  var config = {
    up: '#30A46C',
    down: '#E2562A',
    text: '#302E2B',
    muted: '#5E5B57',
    grid: 'rgba(48,46,43,0.06)',
    border: 'rgba(48,46,43,0.14)',
    locale: 'en',
    labels: { open: 'O', high: 'H', low: 'L', close: 'C', volume: 'Vol' }
  };
  var movingAverages = [
    { length: 5, color: '#E8A317' },
    { length: 10, color: '#4F7CE0' },
    { length: 20, color: '#A65CD9' }
  ];
  // Bars shown when a series first opens; the rest is a swipe away.
  var initialBars = { '15m': 96, '1h': 72, '4h': 60, '1d': 90, '1w': 80, '1M': 60, '1y': 40 };
  var intraday = { '15m': true, '1h': true, '4h': true };
  var chart, candles, volumes, averages = [];
  var state = { key: null, interval: '1d', bars: [] };

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  // Intraday bars are shifted to the phone's time zone before they reach
  // the chart (which reads every time as UTC), so UTC getters read local.
  function formatTime(time) {
    var d = new Date(time * 1000);
    var y = d.getUTCFullYear();
    if (intraday[state.interval]) {
      return pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()) + ' ' +
        pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes());
    }
    if (state.interval === '1y') return '' + y;
    if (state.interval === '1M') return y + '-' + pad(d.getUTCMonth() + 1);
    return y + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
  }

  function precisionFor(price) {
    if (!(price > 0)) return 2;
    if (price >= 10) return 2;
    if (price >= 1) return 4;
    return Math.min(12, Math.ceil(-Math.log10(price)) + 3);
  }

  var subscripts = '\u2080\u2081\u2082\u2083\u2084\u2085\u2086\u2087\u2088\u2089';

  // Tiny prices drop their leading zeros the way the app does: 0.0\u20853220.
  function formatPrice(value) {
    if (value == null || !isFinite(value)) return '--';
    var abs = Math.abs(value);
    if (abs > 0 && abs < 0.001) {
      // Zeros between the point and the first digit: 5 for 0.0000032.
      var zeros = Math.floor(-Math.log10(abs));
      var digits = Math.floor(abs * Math.pow(10, zeros + 4)).toString().slice(0, 4);
      var count = ('' + zeros).split('').map(function (d) { return subscripts[+d]; }).join('');
      return (value < 0 ? '-' : '') + '0.0' + count + digits;
    }
    return value.toFixed(precisionFor(abs));
  }

  function formatVolume(value) {
    var abs = Math.abs(value);
    var units = [[1e12, 'T'], [1e9, 'B'], [1e6, 'M'], [1e3, 'K']];
    for (var i = 0; i < units.length; i++) {
      if (abs >= units[i][0]) return (value / units[i][0]).toFixed(2) + units[i][1];
    }
    return value.toFixed(abs >= 1 ? 0 : 2);
  }

  function volumeColor(bar) {
    var color = bar.close >= bar.open ? config.up : config.down;
    return color + '66';
  }

  function movingAverage(bars, length) {
    var out = [];
    var sum = 0;
    for (var i = 0; i < bars.length; i++) {
      sum += bars[i].close;
      if (i >= length) sum -= bars[i - length].close;
      if (i >= length - 1) out.push({ time: bars[i].time, value: sum / length });
    }
    return out;
  }

  function ensureChart() {
    if (chart) return;
    chart = LWC.createChart(document.getElementById('chart'), {
      autoSize: true,
      layout: {
        background: { type: 'solid', color: 'transparent' },
        textColor: config.muted,
        fontSize: 10,
        attributionLogo: true
      },
      grid: { vertLines: { color: config.grid }, horzLines: { color: config.grid } },
      // No price axis: the chart runs edge to edge and the legend reads
      // the prices.
      rightPriceScale: { visible: false, scaleMargins: { top: 0.2, bottom: 0.24 } },
      leftPriceScale: { visible: false },
      timeScale: { borderVisible: false, rightOffset: 4, barSpacing: 7, minBarSpacing: 1.5 },
      crosshair: { mode: LWC.CrosshairMode.Normal },
      // Vertical swipes scroll the page around the chart.
      handleScroll: { mouseWheel: true, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false },
      handleScale: { mouseWheel: true, pinch: true, axisPressedMouseMove: { time: true, price: false } },
      localization: { locale: config.locale, timeFormatter: formatTime, priceFormatter: formatPrice }
    });
    candles = chart.addSeries(LWC.CandlestickSeries, {
      borderVisible: false,
      priceLineVisible: true,
      lastValueVisible: true
    });
    volumes = chart.addSeries(LWC.HistogramSeries, {
      priceScaleId: 'volume',
      priceFormat: { type: 'volume' },
      lastValueVisible: false,
      priceLineVisible: false
    });
    chart.priceScale('volume').applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });
    averages = movingAverages.map(function (average) {
      return chart.addSeries(LWC.LineSeries, {
        color: average.color,
        lineWidth: 1,
        priceLineVisible: false,
        lastValueVisible: false,
        crosshairMarkerVisible: false
      });
    });
    chart.subscribeCrosshairMove(function (param) {
      renderLegend(param && param.time !== undefined ? param.time : null);
    });
    applyColors();
  }

  function applyColors() {
    candles.applyOptions({
      upColor: config.up,
      downColor: config.down,
      wickUpColor: config.up,
      wickDownColor: config.down
    });
    chart.applyOptions({
      layout: { textColor: config.muted },
      grid: { vertLines: { color: config.grid }, horzLines: { color: config.grid } },
      localization: { locale: config.locale, timeFormatter: formatTime, priceFormatter: formatPrice }
    });
  }

  function renderSeries() {
    var bars = state.bars;
    candles.setData(bars.map(function (bar) {
      return { time: bar.time, open: bar.open, high: bar.high, low: bar.low, close: bar.close };
    }));
    volumes.setData(bars.map(function (bar) {
      return { time: bar.time, value: bar.volume, color: volumeColor(bar) };
    }));
    averages.forEach(function (series, index) {
      series.setData(movingAverage(bars, movingAverages[index].length));
    });
  }

  function updateTail(fromTime) {
    var bars = state.bars;
    for (var i = 0; i < bars.length; i++) {
      var bar = bars[i];
      if (bar.time < fromTime) continue;
      candles.update({ time: bar.time, open: bar.open, high: bar.high, low: bar.low, close: bar.close });
      volumes.update({ time: bar.time, value: bar.volume, color: volumeColor(bar) });
    }
    averages.forEach(function (series, index) {
      var points = movingAverage(bars, movingAverages[index].length);
      for (var j = 0; j < points.length; j++) {
        if (points[j].time >= fromTime) series.update(points[j]);
      }
    });
  }

  function showLatest() {
    // Months and years span decades: a log scale keeps early prices readable
    // and keeps the axis from dipping below zero.
    var longRange = state.interval === '1M' || state.interval === '1y';
    candles.priceScale().applyOptions({
      mode: longRange ? LWC.PriceScaleMode.Logarithmic : LWC.PriceScaleMode.Normal
    });
    var count = state.bars.length;
    var visible = initialBars[state.interval] || 90;
    var scale = chart.timeScale();
    scale.applyOptions({ timeVisible: !!intraday[state.interval], secondsVisible: false });
    if (count <= visible) {
      scale.applyOptions({ barSpacing: Math.max(4, Math.min(24, (window.innerWidth - 16) / Math.max(count + 4, 8))) });
      scale.fitContent();
    } else {
      scale.applyOptions({ barSpacing: 7 });
      scale.setVisibleLogicalRange({ from: count - visible, to: count + 3 });
    }
  }

  function renderLegend(time) {
    var legend = document.getElementById('legend');
    var bars = state.bars;
    if (!bars.length) { legend.innerHTML = ''; return; }
    var index = bars.length - 1;
    if (time !== null) {
      for (var i = bars.length - 1; i >= 0; i--) {
        if (bars[i].time === time) { index = i; break; }
      }
    }
    var bar = bars[index];
    var previous = index > 0 ? bars[index - 1].close : bar.open;
    var change = previous ? (bar.close - previous) / previous * 100 : 0;
    var color = bar.close >= previous ? config.up : config.down;
    var labels = config.labels;
    function value(label, text, tint) {
      return '<span><b style="color:' + config.muted + ';font-weight:500">' + label + '</b> ' +
        '<span style="color:' + (tint || config.text) + ';margin:0">' + text + '</span></span>';
    }
    var rows = [
      [
        value(labels.open, formatPrice(bar.open)),
        value(labels.high, formatPrice(bar.high)),
        value(labels.low, formatPrice(bar.low)),
        value(labels.close, formatPrice(bar.close), color)
      ],
      [
        '<span style="color:' + config.muted + '">' + formatTime(bar.time) + '</span>',
        '<span style="color:' + color + '">' + (change >= 0 ? '+' : '') + change.toFixed(2) + '%</span>',
        value(labels.volume, formatVolume(bar.volume))
      ],
      []
    ];
    movingAverages.forEach(function (average) {
      if (index + 1 < average.length) return;
      var sum = 0;
      for (var k = index - average.length + 1; k <= index; k++) sum += bars[k].close;
      rows[2].push('<span style="color:' + average.color + '">MA' + average.length + ' ' + formatPrice(sum / average.length) + '</span>');
    });
    legend.innerHTML = rows.filter(function (row) { return row.length; }).map(function (row) {
      return '<div class="row">' + row.join('') + '</div>';
    }).join('');
  }

  window.bennyChart = {
    configure: function (options) {
      for (var key in options) config[key] = options[key];
      ensureChart();
      applyColors();
      if (state.bars.length) renderSeries();
      renderLegend(null);
    },
    setData: function (payload) {
      ensureChart();
      var shift = intraday[payload.interval] ? -new Date().getTimezoneOffset() * 60 : 0;
      var bars = payload.candles.map(function (row) {
        return { time: row[0] + shift, open: row[1], high: row[2], low: row[3], close: row[4], volume: row[5] };
      });
      var previous = state.bars;
      var sameSeries = state.key === payload.key && previous.length > 0 && bars.length >= previous.length &&
        bars.length > 0 && bars[0].time === previous[0].time;
      state.interval = payload.interval;
      if (sameSeries) {
        // A refresh only moves the newest bars; keep where the user scrolled to.
        var from = previous[previous.length - 1].time;
        state.bars = bars;
        updateTail(from);
      } else {
        state.key = payload.key;
        state.bars = bars;
        renderSeries();
        showLatest();
      }
      renderLegend(null);
    }
  };
})();
</script>
</body>
</html>
